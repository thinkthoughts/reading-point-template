artifact_type: engineering_statement

statement:
  id: ES_0003
  title: Engineering Paths
  repository: sensors-becker
  status: developing
  initiated: 2026-07

statement_text: >
  Engineering paths develop from a shared engineering object.
  Hardware, software, and experimental engineering support the
  engineering system through measured engineering states,
  engineering constraints, and engineering refinements.

engineering_object:
  name: microcalorimeter spectroscopy

engineering_paths:

  hardware_engineering:
    purpose: >
      Develop physical sensing systems.

  software_engineering:
    purpose: >
      Develop computational sensing systems.

  experimental_engineering:
    purpose: >
      Connect hardware and software through measured
      engineering activities.

engineering_relationships:

  develops:
    - hardware_engineering
    - software_engineering
    - experimental_engineering

  shares:
    - engineering_object

  supports:
    - engineering_system
    - measured_engineering_states
    - engineering_constraints
    - engineering_refinements
    - leading_specifications

development:

  current:
    - identify engineering paths
    - specify engineering relationships

  next:
    - specify engineering system
    - identify measured engineering states
    - identify engineering constraints
    - identify engineering refinements

